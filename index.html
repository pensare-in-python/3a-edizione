<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Traduzione italiana non ufficiale di Think Python, 3ª edizione, di Allen B. Downey: testo, codice, output, glossari ed esercizi.">
<title>Pensare in Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lettore da manuale — indice a sinistra, testo a colonna centrale (~68ch), "in questa pagina" a destra su schermi larghi */
:root{
  --bg:#f5f7f9; --surface:#ffffff; --fg:#1b2633; --muted:#5b6b7c; --line:#dbe2ea;
  --accent:#1d5c8c; --accent-soft:#e3eef7; --code-bg:#eef2f6; --out-bg:#fbfcfd;
  --err:#a3352a; --err-bg:#fbeceb; --mark:#f2c94c;
  --k:#7b3fa0; --s:#2d7a3e; --n:#b0561b; --c:#7a8794; --f:#1d5c8c; --b:#8a6d00;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Literata", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#171e26; --fg:#dde5ee; --muted:#8e9cab; --line:#29333e;
  --accent:#7ab6e6; --accent-soft:#1c2b3a; --code-bg:#1b232c; --out-bg:#141a21;
  --err:#f08f84; --err-bg:#2b1a19; --mark:#c9a43a;
  --k:#c79bea; --s:#8fd19b; --n:#f0a56b; --c:#7d8a97; --f:#7ab6e6; --b:#e3c35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#171e26; --fg:#dde5ee; --muted:#8e9cab; --line:#29333e;
  --accent:#7ab6e6; --accent-soft:#1c2b3a; --code-bg:#1b232c; --out-bg:#141a21;
  --err:#f08f84; --err-bg:#2b1a19; --mark:#c9a43a;
  --k:#c79bea; --s:#8fd19b; --n:#f0a56b; --c:#7d8a97; --f:#7ab6e6; --b:#e3c35a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:var(--fs);line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--fg);text-decoration:none;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.top .sp{flex:1}
.btn{font:500 14px var(--display);background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
#menuBtn{display:none}
.search{position:relative;flex:0 1 280px;min-width:0}
.search input{width:100%;font:15px var(--display);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.results{position:absolute;top:calc(100% + 6px);right:0;width:min(520px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px}
.results a{display:block;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--fg);font-size:14px;line-height:1.45}
.results a:hover,.results a.sel{background:var(--accent-soft)}
.results b{font-family:var(--display);color:var(--accent);font-size:12px;letter-spacing:.04em;text-transform:uppercase;display:block}
.results mark{background:var(--mark);color:#1b2633;border-radius:2px}
.wrap{display:grid;grid-template-columns:290px minmax(0,1fr) 230px;align-items:start}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);height:calc(100vh - 55px - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);padding:18px 10px 40px 16px;font-family:var(--display);font-size:14.5px}
.side h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 8px 6px;font-weight:500}
.side a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--fg);text-decoration:none;line-height:1.35}
.side a .num{font-variant-numeric:tabular-nums;color:var(--muted);min-width:1.6em;font-size:13px}
.side a:hover{background:var(--accent-soft)}
.side a.cur{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side a.cur .num{color:var(--accent)}
.side a.off{color:var(--muted);pointer-events:none;opacity:.6}
.side a .done{margin-left:auto;color:var(--accent);font-size:12px}
main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
article{max-width:46rem;margin:0 auto}
.eyebrow{font-family:var(--display);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
article h1{font-family:var(--display);font-size:clamp(30px,5vw,42px);line-height:1.1;letter-spacing:-.02em;margin:.2em 0 .5em;text-wrap:balance}
article h2{font-family:var(--display);font-size:26px;line-height:1.2;margin:2.2em 0 .5em;letter-spacing:-.01em;text-wrap:balance;scroll-margin-top:80px;padding-top:.6em;border-top:1px solid var(--line)}
article h3{font-family:var(--display);font-size:19px;margin:1.8em 0 .4em;scroll-margin-top:80px}
article p,article li{max-width:68ch}
article code{font-family:var(--mono);font-size:.84em;background:var(--code-bg);padding:.1em .35em;border-radius:4px}
article blockquote{margin:1em 0;padding:.4em 1em;border-left:3px solid var(--line);color:var(--muted)}
article img{max-width:100%;height:auto}
article table{border-collapse:collapse;font-size:15px}
article td,article th{border:1px solid var(--line);padding:4px 8px}
.tw{overflow-x:auto}
article > pre,article li pre,article blockquote pre{background:var(--code-bg);border-radius:8px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55;max-width:100%}
article > pre code,article li pre code,article blockquote pre code{background:none;padding:0;font-size:inherit}
article p,article li,article td{overflow-wrap:anywhere}

.cell{margin:1.1em 0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.cell .src{position:relative;background:var(--code-bg)}
.cell pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55;tab-size:4}
.cell .src pre{padding-right:64px}
.copy{position:absolute;top:6px;right:6px;font:500 12px var(--display);background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 7px;cursor:pointer}
.copy:hover{color:var(--accent);border-color:var(--accent)}
.out{border-top:1px solid var(--line);background:var(--out-bg)}
.out pre{color:var(--fg)}
.out .lbl{font:500 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 14px 0}
.out.err{background:var(--err-bg)} .out.err pre{color:var(--err)}
.out .img{padding:10px 14px;overflow-x:auto}
.out .img img{background:#fff;border-radius:4px}
.out .html{padding:10px 14px;overflow-x:auto}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
mjx-container[display="true"]{display:block;padding:4px 0}
details.diag summary{cursor:pointer;font:500 13px var(--display);color:var(--muted);padding:8px 14px;background:var(--code-bg)}
details.diag[open] summary{border-bottom:1px solid var(--line)}
.hljs-keyword,.hljs-built_in.hljs-keyword{color:var(--k)} .hljs-string{color:var(--s)} .hljs-number,.hljs-literal{color:var(--n)}
.hljs-comment{color:var(--c);font-style:italic} .hljs-title,.hljs-title.function_{color:var(--f)} .hljs-built_in{color:var(--b)} .hljs-meta{color:var(--c)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:3.5em;flex-wrap:wrap}
.pager a{flex:1 1 220px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--fg);font-family:var(--display);background:var(--surface)}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.pager .nx{text-align:right}
.readrow{margin-top:2.5em;display:flex;gap:10px;align-items:center;font-family:var(--display);font-size:15px;color:var(--muted)}
.readrow input{width:18px;height:18px;accent-color:var(--accent)}
aside.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);max-height:calc(100vh - 55px);overflow:auto;padding:28px 16px 40px 8px;font-family:var(--display);font-size:13.5px}
.toc h4{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500}
.toc a{display:block;padding:4px 10px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;line-height:1.35}
.toc a.l3{padding-left:22px;font-size:12.5px}
.toc a.on{border-left-color:var(--accent);color:var(--accent)}
.mtoc{display:none;margin:0 0 1.5em;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--display)}
.mtoc summary{padding:10px 14px;cursor:pointer;font-weight:500}
.mtoc a{display:block;padding:6px 14px;text-decoration:none;font-size:14px}
.home-hero{padding:1em 0 .5em}
.home-hero p.lead{font-size:1.15em;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:1.5em 0}
.card{display:block;border:1px solid var(--line);border-radius:8px;padding:14px;text-decoration:none;color:var(--fg);background:var(--surface)}
.card:hover{border-color:var(--accent)}
.card .n{font:700 12px var(--display);color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.card .t{font:600 17px/1.25 var(--display);margin:.2em 0 .3em}
.card .m{font-size:13px;color:var(--muted);font-family:var(--display)}
.card.off{opacity:.55;pointer-events:none}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;background:var(--accent)}
.note{font-family:var(--display);font-size:14px;color:var(--muted);border-top:1px solid var(--line);margin-top:3em;padding-top:1em}
.fs{display:inline-flex}
.fs .btn{border-radius:0} .fs .btn:first-child{border-radius:6px 0 0 6px} .fs .btn:last-child{border-radius:0 6px 6px 0;border-left:0}
.scrim{display:none}
@media (max-width:1180px){.wrap{grid-template-columns:270px minmax(0,1fr)} aside.toc{display:none} .mtoc{display:block}}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:inline-flex}
  nav.side{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);height:auto;z-index:40;background:var(--surface);transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  body.menu nav.side{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .brand small{display:none}
  .fs{display:none}
}
@media (max-width:520px){.colab-txt{display:none}.brand{font-size:16px}.top .sp{display:none}.search{flex:1 1 120px}.top{gap:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <button class="btn" id="menuBtn" aria-label="Apri indice">☰</button>
  <a class="brand" href="#home">Pensare in Python <small>Think Python 3ª ed. · in italiano</small></a>
  <span class="sp"></span>
  <div class="search"><input id="q" type="search" placeholder="Cerca nel libro…" autocomplete="off" aria-label="Cerca nel libro"><div class="results" id="res" hidden></div></div>
  <span class="fs"><button class="btn" id="fsm" aria-label="Testo più piccolo">A−</button><button class="btn" id="fsp" aria-label="Testo più grande">A+</button></span>
  <a class="btn" id="colab" href="#" target="_blank" rel="noopener" hidden>▶ <span class="colab-txt">Esegui su Colab</span></a>
</header>
<div class="scrim" id="scrim"></div>
<div class="wrap">
  <nav class="side" id="side" aria-label="Capitoli"></nav>
  <main><article id="art"><p>Caricamento…</p></article></main>
  <aside class="toc" id="toc"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'},startup:{typeset:false}};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<script>
const IT_TITLES=["Prefazione","La programmazione come modo di pensare","Variabili e istruzioni","Funzioni","Funzioni e interfacce","Istruzioni condizionali e ricorsione","Valori di ritorno","Iterazione e ricerca","Stringhe ed espressioni regolari","Liste","Dizionari","Tuple","Analisi e generazione di testo","File e database","Classi e funzioni","Classi e metodi","Classi e oggetti","Ereditarietà","Extra di Python","Riflessioni finali"];
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let TOC=[], cache={}, read=store.get('tp-read',{});
const pad=n=>String(n).padStart(2,'0');
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[`*_]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const chName=n=>n===0?'Prefazione':'Capitolo '+n;
marked.setOptions({gfm:true,breaks:false});

let fs=store.get('tp-fs',17);
function applyFs(){document.documentElement.style.setProperty('--fs',fs+'px')}
applyFs();
$('#fsm').onclick=()=>{fs=Math.max(14,fs-1);store.set('tp-fs',fs);applyFs()};
$('#fsp').onclick=()=>{fs=Math.min(22,fs+1);store.set('tp-fs',fs);applyFs()};
$('#menuBtn').onclick=()=>document.body.classList.toggle('menu');
$('#scrim').onclick=()=>document.body.classList.remove('menu');

async function load(n){ if(!cache[n]){const r=await fetch(`data/ch${pad(n)}.json`);cache[n]=await r.json()} return cache[n]; }

function renderSide(cur){
  const s=$('#side'); let h='<h4>Introduzione</h4>';
  TOC.forEach(c=>{
    if(c.n===1) h+='<h4>Capitoli</h4>';
    h+=`<a href="#cap${pad(c.n)}" class="${c.n===cur?'cur':''} ${c.ready?'':'off'}"><span class="num">${c.n?c.n+'.':'·'}</span><span>${IT_TITLES[c.n]}${c.ready?'':' <em style="font-size:12px">(in arrivo)</em>'}</span>${read[c.n]?'<span class="done" title="Letto">✓</span>':''}</a>`;
  });
  h+='<h4>Info</h4><a href="#home"><span class="num">·</span><span>Home e licenza</span></a>';
  s.innerHTML=h;
}

function renderOut(o){
  if(o.k==='img') return `<div class="out"><div class="img"><img src="${o.d}" alt="Output grafico della cella" loading="lazy"></div></div>`;
  if(o.k==='html') return `<div class="out"><div class="html">${o.d}</div></div>`;
  if(o.k==='note') return `<div class="out"><div class="lbl">Nota</div><pre style="font-family:var(--display);white-space:pre-wrap">${esc(o.d)}</pre></div>`;
  if(o.k==='error') return `<div class="out err"><div class="lbl">Errore</div><pre>${esc(o.d)}</pre></div>`;
  const t=o.d.length>6000?o.d.slice(0,6000)+'\n… (output troncato)':o.d;
  return `<div class="out"><div class="lbl">Output</div><pre>${esc(t)}</pre></div>`;
}
function renderCode(c,i){
  const hl=hljs.highlight(c.s,{language:'python',ignoreIllegals:true}).value;
  const src=`<div class="src"><pre><code>${hl}</code></pre><button class="copy" data-i="${i}">Copia</button></div>`;
  const outs=(c.o||[]).map(renderOut).join('');
  if(c.h) return `<div class="cell"><details class="diag"><summary>Codice che genera il diagramma (mostra)</summary>${src}</details>${outs}</div>`;
  return `<div class="cell">${src}${outs}</div>`;
}

async function showChapter(n,sec){
  const d=await load(n); const art=$('#art');
  let html=`<div class="eyebrow">${chName(n)}</div>`, codes=[], heads=[];
  const used={};
  d.cells.forEach(c=>{
    if(c.t==='md'){
      if(/\[Run this notebook on Colab\]|\[Esegui questo notebook su Colab\]/.test(c.s)) return;
      const maths=[];
      let src=c.s.replace(/\$\$([\s\S]+?)\$\$/g,(m,x)=>{maths.push('\\['+x+'\\]');return '@@M'+(maths.length-1)+'@@'})
                 .replace(/(^|[^\\$])\$([^\s$][^$\n]*?)\$/g,(m,p,x)=>{maths.push('\\('+x+'\\)');return p+'@@M'+(maths.length-1)+'@@'});
      let h=marked.parse(src).replace(/@@M(\d+)@@/g,(m,i)=>esc(maths[+i]));
      h=h.replace(/<h([23])>(.*?)<\/h\1>/g,(m,l,t)=>{let id=slug(t.replace(/<[^>]+>/g,''));used[id]=(used[id]||0)+1;if(used[id]>1)id+='-'+used[id];heads.push({l,id,t});return `<h${l} id="${id}">${t}</h${l}>`});
      h=h.replace(/<table/g,'<div class="tw"><table').replace(/<\/table>/g,'</table></div>');
      html+=h;
    } else { codes.push(c.s); html+=renderCode(c,codes.length-1); }
  });
  const prev=TOC.filter(c=>c.ready&&c.n<n).pop(), next=TOC.find(c=>c.ready&&c.n>n);
  html+=`<label class="readrow"><input type="checkbox" id="readck" ${read[n]?'checked':''}> Segna questo capitolo come letto</label>`;
  html+=`<div class="pager">${prev?`<a href="#cap${pad(prev.n)}"><small>← Precedente</small>${IT_TITLES[prev.n]}</a>`:'<span></span>'}${next?`<a class="nx" href="#cap${pad(next.n)}"><small>Successivo →</small>${IT_TITLES[next.n]}</a>`:''}</div>`;
  html+=`<p class="note">Traduzione di <em>Think Python, 3rd edition</em> di Allen B. Downey, distribuita con licenza CC BY-NC-SA 4.0. Il codice è sotto licenza MIT ed è lasciato identico all'originale.</p>`;
  const h3=heads.filter(h=>h.l==='2');
  const mt=`<details class="mtoc"><summary>In questo capitolo (${h3.length} sezioni)</summary>${h3.map(h=>`<a href="#" data-go="${h.id}">${h.t}</a>`).join('')}</details>`;
  html=html.replace(/(<h1[^>]*>.*?<\/h1>)/,'$1'+mt);
  art.innerHTML=html;
  art.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{const t=codes[+b.dataset.i];navigator.clipboard.writeText(t).then(()=>{b.textContent='Copiato';setTimeout(()=>b.textContent='Copia',1400)}).catch(()=>{const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r)})});
  $('#readck').onchange=e=>{read[n]=e.target.checked;store.set('tp-read',read);renderSide(n)};
  $('#toc').innerHTML='<h4>In questo capitolo</h4>'+heads.map(h=>`<a href="#" data-go="${h.id}" class="l${h.l}">${h.t}</a>`).join('');
  document.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.go)?.scrollIntoView({behavior:'smooth'})});
  const cb=$('#colab'); cb.hidden=n===0; cb.href=`https://colab.research.google.com/github/pensare-in-python/3a-edizione/blob/main/notebooks/chap${pad(n)}.ipynb`;
  cb.title='Apre il notebook di questo capitolo, in italiano, su Google Colab';
  renderSide(n); document.title='Pensare in Python';
  if(sec){setTimeout(()=>document.getElementById(sec)?.scrollIntoView(),30)} else window.scrollTo(0,0);
  spy();
  if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([art]).catch(()=>{});
}

function showHome(){
  const ready=TOC.filter(c=>c.ready).length, nr=Object.values(read).filter(Boolean).length;
  let h=`<div class="home-hero"><div class="eyebrow">Think Python · terza edizione</div><h1>Pensare in Python</h1>
  <p class="lead">La traduzione italiana completa del libro di Allen B. Downey: testo, esempi di codice con i loro output, glossari ed esercizi di ogni capitolo.</p>
  <p style="font-family:var(--display);font-size:14px;color:var(--muted)">Capitoli letti: ${nr} su ${TOC.length}${ready<TOC.length?` · tradotti finora: ${ready} su ${TOC.length}`:''}</p>
  <div class="bar"><i style="width:${nr/TOC.length*100}%"></i></div></div><div class="grid">`;
  TOC.forEach(c=>{h+=`<a class="card ${c.ready?'':'off'}" href="#cap${pad(c.n)}"><div class="n">${chName(c.n)}${read[c.n]?' · ✓ letto':''}</div><div class="t">${IT_TITLES[c.n]}</div><div class="m">${c.ready?c.secs.length+' sezioni':'Traduzione in arrivo'}</div></a>`});
  h+=`</div><h2 id="come-usarla">Come usarla</h2><p>Ogni capitolo riporta il codice esattamente come nell'originale, seguito dall'output che produce. Il pulsante <strong>Esegui su Colab</strong> in alto apre su Google Colab il notebook del capitolo, tradotto in italiano, dove puoi eseguire e modificare il codice. Tutti i notebook sono anche nella cartella <a href="https://github.com/pensare-in-python/3a-edizione/tree/main/notebooks" target="_blank" rel="noopener">notebooks del repository</a>, da scaricare e aprire con Jupyter. Le celle che disegnano i diagrammi sono chiuse per default; puoi aprirle se ti interessa come sono costruiti.</p>
  <p>Nei glossari e alle definizioni trovi tra parentesi il termine inglese originale, utile perché messaggi di errore, documentazione e assistenti virtuali usano quei nomi. La ricerca in alto cerca in tutti i capitoli.</p>
  <h2 id="licenza">Licenza e fonte</h2><p><em>Think Python, 3rd edition</em>, © Allen B. Downey, testo distribuito con licenza <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.it" target="_blank" rel="noopener">Creative Commons BY-NC-SA 4.0</a>; codice con <a href="https://mit-license.org/" target="_blank" rel="noopener">licenza MIT</a>. Originale: <a href="https://allendowney.github.io/ThinkPython/" target="_blank" rel="noopener">allendowney.github.io/ThinkPython</a>. Questa traduzione non è ufficiale, è per uso di studio non commerciale ed è soggetta alla stessa licenza.</p>`;
  $('#art').innerHTML=h; $('#toc').innerHTML=''; $('#colab').hidden=true; renderSide(-1); window.scrollTo(0,0);
}

function route(){
  document.body.classList.remove('menu');
  const m=location.hash.match(/^#cap(\d\d)(?:-(.+))?$/);
  if(m&&TOC[+m[1]]?.ready) showChapter(+m[1],m[2]); else showHome();
}

function spy(){
  const links=[...document.querySelectorAll('#toc a')]; if(!links.length) return;
  const hs=links.map(a=>document.getElementById(a.dataset.go));
  let y=window.scrollY+110, k=0; hs.forEach((h,i)=>{if(h&&h.offsetTop<=y)k=i});
  links.forEach((a,i)=>a.classList.toggle('on',i===k));
}
addEventListener('scroll',()=>requestAnimationFrame(spy),{passive:true});

// Ricerca
let all=null, sel=-1;
async function ensureAll(){ if(all) return all; all=[];
  for(const c of TOC.filter(c=>c.ready)){const d=await load(c.n);let sec='',sid='';
    d.cells.forEach(x=>{const txt=x.t==='md'?x.s:x.s;const hm=x.t==='md'&&x.s.match(/^##\s+(.+)$/m);if(hm){sec=hm[1];sid=slug(hm[1])}
      all.push({n:c.n,sec,sid,txt:txt.replace(/[#*`_>\[\]]/g,' ').replace(/\(http[^)]*\)/g,'').replace(/\s+/g,' ')})})}
  return all;}
async function doSearch(){
  const q=$('#q').value.trim(), box=$('#res'); if(q.length<3){box.hidden=true;return}
  const A=await ensureAll(), ql=q.toLowerCase(), out=[];
  for(const e of A){const i=e.txt.toLowerCase().indexOf(ql);if(i>=0){out.push({...e,i});if(out.length>40)break}}
  sel=-1;
  box.innerHTML=out.length?out.map(e=>{const a=Math.max(0,e.i-60);const sn=esc(e.txt.slice(a,e.i))+'<mark>'+esc(e.txt.slice(e.i,e.i+q.length))+'</mark>'+esc(e.txt.slice(e.i+q.length,e.i+q.length+90));
    return `<a href="#cap${pad(e.n)}${e.sid?'-'+e.sid:''}"><b>${chName(e.n)}${e.sec?' · '+esc(e.sec.replace(/[`*]/g,'')):''}</b>${a?'…':''}${sn}…</a>`}).join(''):'<a><b>Nessun risultato</b>Prova con un\'altra parola.</a>';
  box.hidden=false;
}
let tmr; $('#q').addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(doSearch,180)});
$('#q').addEventListener('keydown',e=>{const L=[...$('#res').querySelectorAll('a[href]')];if(e.key==='ArrowDown'){sel=Math.min(L.length-1,sel+1)}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1)}else if(e.key==='Enter'&&L[Math.max(sel,0)]){location.hash=L[Math.max(sel,0)].getAttribute('href');$('#res').hidden=true;return}else if(e.key==='Escape'){$('#res').hidden=true;return}else return;e.preventDefault();L.forEach((a,i)=>a.classList.toggle('sel',i===sel))});
$('#res').addEventListener('click',e=>{if(e.target.closest('a[href]'))$('#res').hidden=true});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#res').hidden=true});

addEventListener('hashchange',route);
fetch('data/toc.json').then(r=>r.json()).then(t=>{TOC=t;route()}).catch(()=>{$('#art').innerHTML='<p>Non riesco a caricare l\'indice del libro. Ricarica la pagina.</p>'});
</script>
